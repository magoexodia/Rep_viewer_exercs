<html>
  <style>
    body {
    }

    pre { white-space: pre-wrap; word-wrap: break-word; }
</style>
</head>
<body>

    <!-- A "caixa" onde o texto bruto vai entrar -->
    <pre id="conteudo"></pre>

<script>
    // Puxa o README.md e joga o texto cru direto na tela dentro da tag <pre>
    fetch('https://magoexodia.github.io/Rep_viewer_exercs/README.md')
        .then(res => res.text())
        .then(textoCru => {
            document.getElementById('conteudo').innerHTML = textoCru;
        });
</script>

</body>
</html>
