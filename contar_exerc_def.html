<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Contador Pro de Treino</title>
<style>
:root{--bg:#000;--fg:#fff}
[data-theme="light"]{--bg:#fff;--fg:#000}
*{box-sizing:border-box;user-select:none;-webkit-user-select:none}
html,body{height:100vh;height:100svh;margin:0;font-family:sans-serif;background:var(--bg);color:var(--fg);overflow:hidden;display:flex;flex-direction:column;justify-content:center;align-items:center}

.screen{display:none;width:100vw;height:100vh;height:100svh;justify-content:center;align-items:center;flex-direction:column;padding:1rem}

/* Força Modo Paisagem sempre usando a maior dimensão da tela */
@media (orientation: portrait) {
  .screen.active {
    display: flex;
    position: fixed;
    top: 50%;
    left: 50%;
    width: 100vh !important;
    height: 100vw !important;
    transform: translate(-50%, -50%) rotate(90deg);
    transform-origin: center;
  }
}

@media (orientation: landscape) {
  .screen.active {
    display: flex;
    width: 100vw;
    height: 100vh;
    transform: none;
  }
}

.cnt-box{display:flex;flex-direction:column;align-items:center;justify-content:center}
.cnt{font-size:clamp(5rem,22vh,14vh);font-weight:900;line-height:1}
.sub-cnt{font-size:clamp(1.5rem,6vh,3.5vh);font-weight:700;opacity:.8;margin-bottom:.5rem}
.controls{display:flex;gap:1.5rem;margin-top:1rem}
button,input,select{font-size:1.1rem;padding:.7rem 1rem;border:2px solid var(--fg);background:var(--bg);color:var(--fg);border-radius:.8rem;cursor:pointer}
input[type=text],input[type=number],select{width:100%;max-width:350px;text-align:center}
button:active{background:var(--fg);color:var(--bg)}
.cfg-group{display:flex;flex-direction:column;gap:.8rem;align-items:center;width:100%;max-width:380px}
.opt-row{display:flex;gap:.5rem;width:100%;justify-content:center}
.opt-row label{flex:1;text-align:center;padding:.5rem;border:2px solid var(--fg);border-radius:.8rem;opacity:.5;cursor:pointer;font-size:.9rem}
.opt-row input[type=radio]{display:none}
.opt-row label:has(input:checked){opacity:1;background:var(--fg);color:var(--bg);font-weight:900}
.menu-float{position:fixed;bottom:1rem;display:flex;gap:.5rem;background:var(--bg);padding:.4rem;border:2px solid var(--fg);border-radius:2rem;z-index:100}
.menu-float button{padding:.4rem .8rem;font-size:.9rem;border-radius:1.5rem}
#mediaScreen{position:fixed;inset:0;background:#000;z-index:1000;display:none;justify-content:center;align-items:center;flex-direction:column}
#mediaScreen.active{display:flex}
#mediaScreen img,#mediaScreen video{width:100%;height:85%;object-fit:contain}
#mediaTimer{font-size:3rem;font-weight:900;margin-top:1rem}
</style>
</head>
<body>

<!-- Tela 1: Configuração -->
<div class="screen active" id="s1">
  <div class="cfg-group">
    <label style="width:100%;text-align:center">Modo de Treino:
      <select id="modoTreino" onchange="renderCfg()">
        <option value="rep_serie">Repetições + Séries</option>
        <option value="serie">Só Séries</option>
        <option value="rep">Só Repetições Contínuas</option>
      </select>
    </label>

    <div id="fReps" style="width:100%"><label>Reps por Série: <input type="number" id="cfgReps" value="12" min="1"></label></div>
    <div id="fSeries" style="width:100%"><label>Meta de Séries: <input type="number" id="cfgSeries" value="3" min="1"></label></div>

    <div id="fDescansoOpt" class="opt-row">
      <label><input type="radio" name="momentoDesc" id="descEntre" checked><span>Descanso / Série</span></label>
      <label><input type="radio" name="momentoDesc" id="descFim"><span>Descanso no Fim</span></label>
    </div>

    <label>Tempo de Descanso entre Séries (seg): <input type="number" id="tempoDesc" value="30" min="1"></label>

    <div class="opt-row">
      <label><input type="radio" name="origem" id="optWeb" checked onchange="toggleOrigem()"><span>🌐 Web</span></label>
      <label><input type="radio" name="origem" id="optFile" onchange="toggleOrigem()"><span>📂 Local</span></label>
    </div>

    <div id="divWeb" style="width:100%"><input type="text" id="linkWeb" value="https://64.media.tumblr.com/4104296cd5cff714f3b27c7bba1d241d/222b479f856fb2d6-ef/s400x600/004e681207bb1b80900411107dc7ef95157c6025.gifv" onclick="this.select()"></div>
    <div id="divFile" style="width:100%;display:none"><input type="file" id="fileLocal" accept="image/*,video/*"></div>

    <button onclick="startTreino()" style="font-weight:900;width:100%">✅ INICIAR TREINO</button>
  </div>
</div>

<!-- Tela 2: Execução do Treino -->
<div class="screen" id="s2">
  <div class="cnt-box" onclick="inc()">
    <div id="subCnt" class="sub-cnt">Série: 1 / 3</div>
    <div id="mainCnt" class="cnt">0</div>
  </div>
  <div class="controls">
    <button onclick="dec()">➖</button>
    <button onclick="resetCurrent()">🔁</button>
    <button onclick="goScreen(1)">❌</button>
  </div>
</div>

<!-- Tela 3: Mídia / Descanso -->
<div id="mediaScreen">
  <div id="mediaContainer" style="width:100%;height:85%;display:flex;justify-content:center;align-items:center"></div>
  <div id="mediaTimer">00</div>
</div>

<!-- Menu Flutuante -->
<div class="menu-float">
  <button onclick="toggleTheme()">☀️</button>
  <button onclick="goScreen(1)">⚙️</button>
</div>

<script>
const $=id=>document.getElementById(id), s1=$('s1'), s2=$('s2'), mainCnt=$('mainCnt'), subCnt=$('subCnt'), mc=$('mediaContainer'), msElem=$('mediaScreen'), mTimer=$('mediaTimer');

let mode='rep_serie', curReps=0, curSeries=1, maxReps=12, maxSeries=3, mediaUrl=null, isBlob=false, intervalId=null;

async function lockOrientation() {
  try {
    if (document.documentElement.requestFullscreen) await document.documentElement.requestFullscreen();
    if (screen.orientation && screen.orientation.lock) await screen.orientation.lock('landscape');
  } catch (e) {}
}

function renderCfg(){
  mode = $('modoTreino').value;
  $('fReps').style.display = (mode === 'serie') ? 'none' : 'block';
  $('fSeries').style.display = (mode === 'rep') ? 'none' : 'block';
  $('fDescansoOpt').style.display = (mode === 'rep_serie') ? 'flex' : 'none';
}

function toggleOrigem(){
  let isWeb = $('optWeb').checked;
  $('divWeb').style.display = isWeb ? 'block' : 'none';
  $('divFile').style.display = isWeb ? 'none' : 'block';
}

function goScreen(n){
  s1.classList.remove('active'); s2.classList.remove('active');
  if(n===1) s1.classList.add('active');
  if(n===2) s2.classList.add('active');
}

function startTreino(){
  lockOrientation();
  mode = $('modoTreino').value;
  maxReps = parseInt($('cfgReps').value)||1;
  maxSeries = parseInt($('cfgSeries').value)||1;
  curReps = 0;
  curSeries = 1;
  updateDisplay();
  goScreen(2);
}

function updateDisplay(){
  if(mode==='rep_serie'){
    subCnt.style.display='block';
    subCnt.textContent = `Série: ${curSeries} / ${maxSeries}`;
    mainCnt.textContent = curReps;
  } else if(mode==='serie'){
    subCnt.style.display='none';
    mainCnt.textContent = `${curSeries} / ${maxSeries}`;
  } else {
    subCnt.style.display='none';
    mainCnt.textContent = `${curReps} / ${maxReps}`;
  }
}

function inc(){
  if(mode==='rep_serie'){
    curReps++;
    if(curReps >= maxReps){
      if($('descEntre').checked || curSeries >= maxSeries){
        let isFinal = (curSeries >= maxSeries);
        triggerMedia(isFinal ? 15 : (parseInt($('tempoDesc').value)||30), isFinal, ()=>{
          nextSerieOrEnd();
        });
      } else {
        nextSerieOrEnd();
      }
    } else {
      updateDisplay();
    }
  } else if(mode==='serie'){
    let isFinal = (curSeries >= maxSeries);
    if($('descEntre').checked || isFinal){
      triggerMedia(isFinal ? 15 : (parseInt($('tempoDesc').value)||30), isFinal, ()=>{
        if(curSeries < maxSeries){ curSeries++; updateDisplay(); }
        else { goScreen(1); }
      });
    } else {
      if(curSeries < maxSeries){ curSeries++; updateDisplay(); }
      else { goScreen(1); }
    }
  } else if(mode==='rep'){
    curReps++;
    if(curReps >= maxReps){
      triggerMedia(15, true, ()=>goScreen(1));
    } else {
      updateDisplay();
    }
  }
}

function nextSerieOrEnd(){
  curReps = 0;
  if(curSeries < maxSeries){
    curSeries++;
    updateDisplay();
  } else {
    goScreen(1);
  }
}

function dec(){
  if(mode==='rep_serie' && curReps > 0) curReps--;
  if(mode==='serie' && curSeries > 1) curSeries--;
  if(mode==='rep' && curReps > 0) curReps--;
  updateDisplay();
}

function resetCurrent(){
  curReps = 0;
  updateDisplay();
}

function triggerMedia(durationSec, isFinal, cb){
  let useWeb = $('optWeb').checked;

  if(isBlob && mediaUrl){ URL.revokeObjectURL(mediaUrl); isBlob=false; }

  if(isFinal){
    mc.innerHTML=`<div style="font-size:3.5rem;font-weight:900">TREINO CONCLUÍDO!</div>`;
  } else {
    if(useWeb){
      let link = $('linkWeb').value.trim();
      if(link){
        mediaUrl = link;
        if(link.includes('.mp4')||link.includes('.gifv')||link.includes('.webm'))
          mc.innerHTML=`<video src="${mediaUrl}" autoplay muted loop playsinline></video>`;
        else mc.innerHTML=`<img src="${mediaUrl}">`;
      } else mc.innerHTML=`<div style="font-size:4rem;font-weight:900">DESCANSO</div>`;
    } else {
      let file = $('fileLocal').files[0];
      if(file){
        mediaUrl = URL.createObjectURL(file); isBlob = true;
        if(file.type.includes('video')) mc.innerHTML=`<video src="${mediaUrl}" autoplay muted loop playsinline></video>`;
        else mc.innerHTML=`<img src="${mediaUrl}">`;
      } else mc.innerHTML=`<div style="font-size:4rem;font-weight:900">DESCANSO</div>`;
    }
  }

  msElem.classList.add('active');
  let timeLeft = durationSec;
  mTimer.textContent = timeLeft;

  clearInterval(intervalId);
  intervalId = setInterval(()=>{
    timeLeft--;
    mTimer.textContent = timeLeft;
    if(timeLeft <= 0){
      clearInterval(intervalId);
      msElem.classList.remove('active');
      mc.innerHTML='';
      if(cb) cb();
    }
  }, 1000);
}

function toggleTheme(){
  let isLight=document.body.getAttribute('data-theme')==='light';
  document.body.setAttribute('data-theme', isLight?'':'light');
}

$('fileLocal').onchange=ev=>{
  let f=ev.target.files[0];
  if(f){
    if(isBlob && mediaUrl) URL.revokeObjectURL(mediaUrl);
    mediaUrl=URL.createObjectURL(f);
    isBlob=true;
  }
};

renderCfg();
</script>
</body>
</html>
