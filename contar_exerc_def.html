<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#000000">
<title>Dual Timer</title>
<link id="manifest" rel="manifest">
<style>
:root{--bg:#000;--fg:#fff;--acc:#222;--brd:#444}
[data-theme="light"]{--bg:#fff;--fg:#000;--acc:#eee;--brd:#ccc}
*{box-sizing:border-box;user-select:none;-webkit-user-select:none;margin:0;padding:0;font-family:system-ui,-apple-system,monospace}
html,body{width:100vw;height:100svh;background:var(--bg);color:var(--fg);overflow:hidden;display:flex;flex-direction:column}
.box{display:flex;justify-content:center;align-items:center;cursor:pointer;overflow:hidden;line-height:1}
#c1-box{height:75%;font-size:min(42vh,52vw);font-weight:900;border-bottom:2px solid var(--brd);width:100%}
#c2-box{height:25%;font-size:min(16vh,24vw);font-weight:800;opacity:.9;width:100%}
#cnt-box{position:fixed;top:1rem;right:1rem;font-size:min(10vh,14vw);font-weight:800;opacity:.75;padding:.3rem .8rem;border:2px solid var(--brd);border-radius:1rem;background:var(--bg);z-index:5;cursor:pointer;line-height:1}
nav{position:fixed;bottom:1rem;left:50%;transform:translateX(-50%);display:flex;gap:.6rem;background:var(--bg);padding:.5rem 1rem;border:2px solid var(--fg);border-radius:2rem;z-index:10;transition:opacity .3s}
nav.hide{opacity:0;pointer-events:none}
button,input,select{font-size:1rem;padding:.5rem .8rem;border:1px solid var(--brd);background:var(--acc);color:var(--fg);border-radius:.6rem;outline:none}
button{cursor:pointer;font-weight:700}
button.pri{background:var(--fg);color:var(--bg);border:none;width:100%;padding:.8rem;margin-top:.5rem}
#modal{position:fixed;inset:0;background:var(--bg);z-index:20;display:none;flex-direction:column;justify-content:center;align-items:center;padding:1.5rem}
#modal.act{display:flex}
.card{width:100%;max-width:380px;display:flex;flex-direction:column;gap:.8rem}
.row{display:flex;justify-content:space-between;align-items:center;gap:.5rem;font-size:.95rem}
.row input[type=number]{width:85px;text-align:center}
.row input[type=text],.row input[type=file],.row select{width:180px}
#ms{position:fixed;inset:0;background:#000;color:#fff;z-index:30;display:none;justify-content:center;align-items:center}
#ms.act{display:flex}
#mc{width:100%;height:100%;display:flex;justify-content:center;align-items:center;padding:1rem;text-align:center}
#ms img,#ms video{max-width:100%;max-height:100%;object-fit:contain}
</style>
</head>
<body onclick="app.tap(event)">

<div id="cnt-box" onclick="app.rstCnt(event)"><span id="cnt">0</span></div>
<div class="box" id="c1-box"><span id="c1">60</span></div>
<div class="box" id="c2-box"><span id="c2">30</span></div>

<nav id="mn" onclick="event.stopPropagation()">
  <button onclick="app.modal(1)">⚙️ Ajustes</button>
  <button onclick="app.theme()">🌓</button>
  <button id="btnInst" style="display:none" onclick="app.install()">📲 Instalar</button>
</nav>

<div id="modal" onclick="event.stopPropagation()">
  <div class="card">
    <h2 style="text-align:center">Configurações</h2>
    <div class="row"><span>C1 (5-300s):</span><input type="number" id="iC1" value="60" min="5" max="300" onchange="app.set(1)"></div>
    <div class="row"><span>C2 (5-180s):</span><input type="number" id="iC2" value="30" min="5" max="180" onchange="app.set(2)"></div>
    <div class="row"><span>Visualização:</span>
      <select id="sView" onchange="app.setView()">
        <option value="both">C1 e C2</option>
        <option value="c1only">Apenas C1</option>
      </select>
    </div>
    <div class="row"><span>Exibir Contador:</span>
      <select id="sShowCnt" onchange="app.setView()">
        <option value="yes">Sim</option>
        <option value="no">Não</option>
      </select>
    </div>
    <div class="row"><span>Gatilho Mídia:</span>
      <select id="sTrig"><option value="none">Nenhum</option><option value="c1" selected>Ao zerar C1</option><option value="c2">Ao zerar C2</option><option value="both">Ambos</option></select>
    </div>
    <div class="row"><span>Duração (0-60s):</span><input type="number" id="iDur" value="15" min="0" max="60"></div>
    <div class="row"><span>Mídia Offline:</span><input type="file" id="iFile" accept="image/*,video/*,audio/*" onchange="app.file(this)"></div>
    <div class="row"><span>Link/Texto:</span><input type="text" id="iMed" placeholder="URL ou Texto" onchange="app.pre()"></div>
    <button class="pri" onclick="app.modal(0)">Salvar e Fechar</button>
  </div>
</div>

<div id="ms" onclick="app.endMed()"><div id="mc"></div></div>

<script>
const icon="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23000'/><text x='50' y='68' font-size='55' text-anchor='middle' fill='%23fff' font-family='monospace' font-weight='bold'>60</text></svg>";
const mf={name:"Dual Timer",short_name:"Timer",start_url:location.href,display:"standalone",background_color:"#000000",theme_color:"#000000",icons:[{src:icon,sizes:"192x192",type:"image/svg+xml"},{src:icon,sizes:"512x512",type:"image/svg+xml"}]};
document.getElementById('manifest').href=URL.createObjectURL(new Blob([JSON.stringify(mf)],{type:'application/json'}));
if('serviceWorker'in navigator){navigator.serviceWorker.register(URL.createObjectURL(new Blob(["self.addEventListener('fetch',e=>{})"],{type:'application/javascript'}))).catch(()=>{});}

const $=id=>document.getElementById(id);
class App{
  constructor(){
    this.t1=60;this.t2=30;this.r1=60;this.r2=30;this.loops=0;
    this.run1=0;this.run2=0;this.iv1=null;this.iv2=null;
    this.mTO=null;this.medTO=null;this.cache=null;this.fUrl=null;this.fType=null;this.defPrompt=null;
    window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();this.defPrompt=e;$('btnInst').style.display='inline-block';});
    this.upd();this.setView();this.menu();
  }
  upd(){$('c1').textContent=this.r1;$('c2').textContent=this.r2;$('cnt').textContent=this.loops;}
  menu(){$('mn').classList.remove('hide');clearTimeout(this.mTO);if(this.run1||this.run2)this.mTO=setTimeout(()=>$('mn').classList.add('hide'),2500);}
  
  tap(e){
    this.menu();
    const b1=e.target.closest('#c1-box'),b2=e.target.closest('#c2-box');
    const view=$('sView').value;
    if(b1)this.run1?(this.r1=this.t1,this.upd()):this.go(1);
    else if(b2 && view==='both')this.run2?(this.r2=this.t2,this.upd()):this.go(2);
    else(!this.run1&&!this.run2)?(this.go(1),view==='both'&&this.go(2)):(this.r1=this.t1,this.r2=this.t2,this.upd());
  }
  rstCnt(e){e.stopPropagation();this.loops=0;this.upd();this.menu();}
  
  setView(){
    const view=$('sView').value;
    const showCnt=$('sShowCnt').value==='yes';
    const c1Box=$('c1-box');
    const c2Box=$('c2-box');
    const cntBox=$('cnt-box');

    cntBox.style.display=showCnt?'block':'none';

    if(view==='c1only'){
      c2Box.style.display='none';
      c1Box.style.height='100svh';
      c1Box.style.borderBottom='none';
      c1Box.style.fontSize='min(58vh,78vw)';
    }else{
      c2Box.style.display='flex';
      c1Box.style.height='75%';
      c1Box.style.borderBottom='2px solid var(--brd)';
      c1Box.style.fontSize='min(42vh,52vw)';
    }
  }

  go(n){
    if(n===1&&!this.run1&&this.r1>0){
      this.run1=1;
      this.iv1=setInterval(()=>{
        if(--this.r1<=0){this.stop(1);this.loops++;this.upd();this.chk('c1');}
        else this.upd();
      },1000);
    }
    const view=$('sView').value;
    if(n===2&&!this.run2&&this.r2>0&&view==='both'){
      this.run2=1;
      this.iv2=setInterval(()=>{
        if(--this.r2<=0){this.stop(2);this.upd();this.chk('c2');}
        else this.upd();
      },1000);
    }
    this.menu();
  }
  stop(n){if(n===1){clearInterval(this.iv1);this.run1=0;}else{clearInterval(this.iv2);this.run2=0;}}
  stopAll(){this.stop(1);this.stop(2);clearTimeout(this.medTO);}
  
  set(n){
    if(n===1){this.t1=Math.min(300,Math.max(5,+$('iC1').value||60));$('iC1').value=this.t1;this.r1=this.t1;}
    else{this.t2=Math.min(180,Math.max(5,+$('iC2').value||30));$('iC2').value=this.t2;this.r2=this.t2;}
    this.upd();
  }
  file(inp){
    if(this.fUrl)URL.revokeObjectURL(this.fUrl);
    const f=inp.files?.[0];
    this.fUrl=f?URL.createObjectURL(f):null;
    this.fType=f?f.type:null;
  }
  pre(){
    const v=$('iMed').value.trim();
    if(!v){this.cache=null;return;}
    if(/\.(mp4|webm|ogg)$/i.test(v)){const el=document.createElement('video');el.src=v;el.preload='auto';this.cache=el;}
    else if(/^https?:\/\//i.test(v)){const el=new Image();el.src=v;this.cache=el;}
    else this.cache=v;
  }
  chk(src){
    const tr=$('sTrig').value;
    if(tr===src||tr==='both')this.showMed();
    else{if(src==='c1')this.r1=this.t1;else this.r2=this.t2;this.upd();}
  }
  showMed(){
    const dur=Math.min(60,Math.max(0,+$('iDur').value||0));
    if(!dur){this.r1=this.t1;this.r2=this.t2;this.upd();return;}
    this.stopAll();
    const mc=$('mc');
    if(this.fUrl){
      if(this.fType.startsWith('video'))mc.innerHTML=`<video src="${this.fUrl}" autoplay loop playsinline></video>`;
      else if(this.fType.startsWith('audio'))mc.innerHTML=`<div style="font-size:2.5rem;font-weight:900">🔊 ÁUDIO</div><audio src="${this.fUrl}" autoplay loop></audio>`;
      else mc.innerHTML=`<img src="${this.fUrl}">`;
    }else if(this.cache instanceof HTMLVideoElement)mc.innerHTML=`<video src="${this.cache.src}" autoplay muted loop playsinline></video>`;
    else if(this.cache instanceof HTMLImageElement)mc.innerHTML=`<img src="${this.cache.src}">`;
    else mc.innerHTML=`<div style="font-size:min(12vw,4rem);font-weight:900;word-break:break-word">${this.cache||'DESCANSO'}</div>`;
    
    $('ms').classList.add('act');
    this.medTO=setTimeout(()=>this.endMed(),dur*1000);
  }
  endMed(){
    clearTimeout(this.medTO);
    $('ms').classList.remove('act');
    $('mc').innerHTML='';
    this.r1=this.t1;this.r2=this.t2;
    this.upd();this.menu();
  }
  modal(s){$('modal').classList.toggle('act',!!s);if(s)this.stopAll();else{this.r1=this.t1;this.r2=this.t2;this.upd();this.menu();}}
  theme(){const d=document.documentElement;d.dataset.theme=d.dataset.theme==='dark'?'light':'dark';}
  async install(){if(this.defPrompt){this.defPrompt.prompt();await this.defPrompt.userChoice;this.defPrompt=null;$('btnInst').style.display='none';}}
}
const app=new App();
</script>
</body>
</html>
